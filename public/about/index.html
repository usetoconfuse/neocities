<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>about</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
    <link rel="stylesheet" type="text/css" href="../global/global.css" media="all">
    <link rel="stylesheet" type="text/css" href="about.css" media="all">
    <script src="../global/global.js"></script>
    <script src="about.js"></script>
  </head>
  <body>
    <div class="page-container">
      <div id="about-content-container" class="pixel-corners--inset">
        <div id="figure-carousel-container" class="pixel-corners--inset">
          <div id="image-carousel">
            <h1><strong>WHERE DO YOU SEE ME?</strong></h1>
          </div>
          <div id="figure-frame">
            <img id="island-bg" src="../assets/images/island.webp" alt="Island" draggable="false">
            <img id="figure-body" src="../assets/images/figure/figure-body.webp" alt="Figure" draggable="false">
            <img id="figure-eyes-background" src="../assets/images/figure/figure-eyes-background.webp" alt="Figure" draggable="false">
            <img id="figure-eyes" src="../assets/images/figure/figure-eyes.webp" alt="Figure" draggable="false">
          </div>
          <div id="image-carousel-description">
            <p>Chilling on the beach 😎</p>
          </div>
        </div>
        <div id="about-text-column">
          <h1>DESCRIPTION</h1>
          <p>
            An elusive creature, only seen hiding in the
            cracks of old bricks or lurking underneath old furniture. <br><br>
            This dawdler prefers retreating into the imaginary to navigating reality. <br><br>
            
          </p>
        </div>
      </div>     
    </div>
  </body>
</html>
